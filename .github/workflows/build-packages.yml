name: Build Packages

# Build distributable packages from KiCad sources:
#   - macOS  : .dmg (Apple Silicon)
#   - Linux  : .deb (Debian/Ubuntu) and .AppImage (x86_64)
#
# Triggers:
#   - pushing a tag like v1.2.3 / v10.99.0-rc1  -> builds + attaches to a GitHub Release
#   - manual run (workflow_dispatch)            -> builds + uploads artifacts only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed by the release job when building on a tag

env:
  CMAKE_BUILD_TYPE: Release
  # Keep 3D STEP/OCC and SPICE support enabled; disable telemetry.
  KICAD_CMAKE_EXTRA: >-
    -DKICAD_USE_SENTRY=OFF
    -DKICAD_INSTALL_DEMOS=ON
    -DKICAD_BUILD_I18N=ON
    -DKICAD_BUILD_QA_TESTS=OFF
    -DKICAD_SPICE_QA=OFF

jobs:
  # ---------------------------------------------------------------------------
  # macOS: build and package a .dmg (Apple Silicon)
  # ---------------------------------------------------------------------------
  macos-dmg:
    name: macOS DMG (arm64)
    # macos-15 ships a newer Xcode than macos-14: the code uses C++20
    # std::jthread/std::stop_token, which libc++ only implements from LLVM 19
    # (Xcode 16.3+).  The macos-14 default (Xcode 15.4 / LLVM 17) lacks them.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history for the git-based version string

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew update
          brew install \
            cmake \
            ninja \
            pkg-config \
            wxwidgets \
            boost \
            glm \
            opencascade \
            libgit2 \
            libngspice \
            protobuf \
            openssl@3 \
            zstd \
            curl \
            gettext \
            glslang \
            spirv-cross \
            spirv-tools \
            vulkan-headers \
            unixodbc

      # Homebrew now ships nng 2.0, whose headers/API are incompatible with
      # KiCad's libs/kinng (written against the NNG 1.x API, e.g.
      # nng/protocol/reqrep0/rep.h).  Build the last 1.x release from source
      # into /usr/local - a CMake default search prefix, so Findnng picks it
      # up without extra flags.  NNG 1.x builds a static library by default,
      # so there is no runtime dylib to bundle.
      - name: Build NNG 1.x from source
        run: |
          set -euo pipefail
          brew uninstall --ignore-dependencies nng 2>/dev/null || true
          git clone --depth 1 --branch v1.10.1 \
            https://github.com/nanomsg/nng.git "$RUNNER_TEMP/nng-src"
          cmake -S "$RUNNER_TEMP/nng-src" -B "$RUNNER_TEMP/nng-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNNG_TESTS=OFF \
            -DNNG_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/nng-build"
          sudo cmake --install "$RUNNER_TEMP/nng-build"

      - name: Configure
        env:
          OPENSSL_ROOT_DIR: /opt/homebrew/opt/openssl@3
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DKICAD_USE_SENTRY=OFF \
            -DKICAD_INSTALL_DEMOS=ON \
            -DKICAD_BUILD_I18N=ON \
            -DKICAD_BUILD_QA_TESTS=OFF \
            -DKICAD_SPICE_QA=OFF \
            -DKICAD_APPLE_MAKE_RELOCATEABLE_BUNDLE=ON \
            -DNGSPICE_LIB_NAME=libngspice.dylib \
            -DOCC_INCLUDE_DIR=/opt/homebrew/include/opencascade

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Install into staging directory
        run: |
          set -euo pipefail
          cmake --install build

      - name: Package DMG
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always --dirty || echo dev)"
          PKGDIR="Kicad"
          mkdir -p dist/"$PKGDIR"
          # Move the staged install into a drag-and-drop style folder
          cp -R stage/. dist/"$PKGDIR"/
          ln -s /Applications dist/Applications
          cat > dist/README.txt <<'EOF'
          KiCad (unofficial build)

          Drag the "Kicad" folder anywhere (e.g. your home or /Applications)
          and run bin/kicad from a terminal, or create an alias.
          EOF

          hdiutil create -volname "KiCad $VERSION" \
            -srcfolder dist \
            -ov -format UDZO \
            "kicad-macos-arm64-$VERSION.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: kicad-macos-arm64-*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: build a .deb (Debian/Ubuntu x86_64)
  # ---------------------------------------------------------------------------
  linux-deb:
    name: Linux DEB (x86_64 ${{ matrix.distro }})
    # One package per LTS: a .deb carries the build host's glibc/dependency
    # versions, so it only installs on that LTS or newer.  24.04 maximises
    # portability, 26.04 targets the newest stack.
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: '24.04'
            runner: ubuntu-24.04
          - distro: '26.04'
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # wxWidgets 3.2 was the 24.04 name; 26.04 may ship 3.3.  Try in order.
          sudo apt-get install -y --no-install-recommends \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev \
            || sudo apt-get install -y --no-install-recommends \
                 libwxgtk3.3-dev libwxgtk-webview3.3-dev
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libboost-all-dev libglm-dev \
            libcairo2-dev libpng-dev libglu1-mesa-dev libgl1-mesa-dev \
            libx11-dev mesa-common-dev libgtk-3-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-foundation-dev libocct-ocaf-dev \
            libgit2-dev libsecret-1-dev libcurl4-openssl-dev \
            libngspice0-dev unixodbc-dev libspnav-dev libnng-dev \
            libprotobuf-dev protobuf-compiler shared-mime-info \
            libzint-dev libpoppler-dev libpoppler-glib-dev \
            libssl-dev libbz2-dev libzstd-dev zlib1g-dev \
            python3-dev libwebkit2gtk-4.1-dev \
            glslang-tools spirv-tools libvulkan-dev \
            gettext dpkg-dev file

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=/usr \
            $KICAD_CMAKE_EXTRA

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)"

      - name: Assemble DEB
        env:
          DISTRO_ID: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always --dirty | sed 's/^v//')"
          STAGE="debstage"
          install -d "$STAGE/DEBIAN" "$STAGE/usr"
          DESTDIR="$PWD/$STAGE" cmake --install build

          # Auto-generate shared-library dependencies from the installed binaries
          EXECUTABLES=$(find "$STAGE/usr" -type f -executable | sort)
          LIBS=$(find "$STAGE/usr" -name '*.so' -o -name '*.kiface' | sort)
          SHLIBS=$(dpkg-shlibdeps -O $EXECUTABLES $LIBS 2>/dev/null \
                     | sed -n 's/^shlibs:Depends=//p' || true)

          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: kicad
          Version: $VERSION
          Section: electronics
          Priority: optional
          Architecture: amd64
          Maintainer: local build <local@invalid>
          Depends: ${SHLIBS:-libc6}, shared-mime-info, xdg-utils
          Description: KiCad EDA suite (unofficial build)
           A full featured electronics design automation suite including
           schematic capture, PCB layout, Gerber viewer and more.
           Built from source by GitHub Actions.
          EOF

          # Documentation of the dependency computation for debugging
          echo "$SHLIBS" > "$STAGE/DEBIAN/shlibs.deps"

          dpkg-deb --root-owner-group --build "$STAGE" "kicad-linux-amd64-$DISTRO_ID-$VERSION.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.distro }}
          path: kicad-linux-amd64-*.deb
          if-no-files-found: error
          # .deb files are already compressed; store them verbatim inside the
          # artifact container instead of wasting time re-compressing.  The
          # .deb keeps its original name inside the container.
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Linux: build an AppImage (x86_64)
  # ---------------------------------------------------------------------------
  linux-appimage:
    name: Linux AppImage (x86_64 ${{ matrix.distro }})
    # One image per LTS.  glibc is not bundled (it must come from the host)
    # and is backward-incompatible, so each image is built on the LTS it
    # targets: the 24.04 build runs on 24.04 and anything newer
    # (glibc <= 2.39), the 26.04 build targets the newest stack.
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: '24.04'
            runner: ubuntu-24.04
          - distro: '26.04'
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # wxWidgets 3.2 was the 24.04 name; 26.04 may ship 3.3.  Try in order.
          sudo apt-get install -y --no-install-recommends \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev \
            || sudo apt-get install -y --no-install-recommends \
                 libwxgtk3.3-dev libwxgtk-webview3.3-dev
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libboost-all-dev libglm-dev \
            libcairo2-dev libpng-dev libglu1-mesa-dev libgl1-mesa-dev \
            libx11-dev mesa-common-dev libgtk-3-dev \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev \
            libocct-data-exchange-dev libocct-visualization-dev \
            libocct-foundation-dev libocct-ocaf-dev \
            libgit2-dev libsecret-1-dev libcurl4-openssl-dev \
            libngspice0-dev unixodbc-dev libspnav-dev libnng-dev \
            libprotobuf-dev protobuf-compiler shared-mime-info \
            libzint-dev libpoppler-dev libpoppler-glib-dev \
            libssl-dev libbz2-dev libzstd-dev zlib1g-dev \
            python3-dev libwebkit2gtk-4.1-dev \
            glslang-tools spirv-tools libvulkan-dev \
            gettext desktop-file-utils file

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE \
            -DCMAKE_INSTALL_PREFIX=/usr \
            $KICAD_CMAKE_EXTRA

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)"

      - name: Install into AppDir
        run: |
          set -euo pipefail
          install -d AppDir/usr
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Build AppImage
        env:
          DISTRO_ID: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          # Find the KiCad internal libraries: the versioned shared libraries
          # (libkigal.so.10.99.0, libkicommon...) do not match a plain '*.so'
          # glob and the .kiface plugins are dlopen()ed, so none of them are
          # picked up by linuxdeploy's own dependency scan.  KiCad installs
          # them into CMAKE_INSTALL_LIBDIR, which on Debian/Ubuntu resolves to
          # the multiarch dir (usr/lib/x86_64-linux-gnu) rather than
          # usr/lib/kicad, so search the whole usr/lib tree.
          INTERNAL_LIBS=()
          while IFS= read -r lib; do
            INTERNAL_LIBS+=( "$lib" )
          done < <(find AppDir/usr/lib -type f \
                     \( -name '*.kiface' -o -name '*.so' -o -name '*.so.*' \) | sort)
          if [ ${#INTERNAL_LIBS[@]} -eq 0 ]; then
            echo "ERROR: no internal KiCad libraries found under AppDir/usr/lib" >&2
            find AppDir/usr -maxdepth 3 -type d | sort >&2
            exit 1
          fi
          echo "Found ${#INTERNAL_LIBS[@]} internal libraries"

          # linuxdeploy resolves the DT_NEEDED entries of the AppDir's ELF
          # files against the top level of AppDir/usr/lib only - it does not
          # recurse into subdirectories like the multiarch
          # usr/lib/x86_64-linux-gnu, which is why it failed with "Could not
          # find dependency: libkigal.so.10.99.0".  Flatten the internal
          # libraries up to usr/lib before invoking linuxdeploy; it then
          # deploys them (and their system dependencies) itself.  Feeding the
          # dir through LD_LIBRARY_PATH additionally helps its resolver.
          mkdir -p AppDir/usr/lib
          for lib in "${INTERNAL_LIBS[@]}"; do
            cp -f "$lib" AppDir/usr/lib/
          done
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib:${LD_LIBRARY_PATH:-}"

          # Bundle libstdc++/libgcc_s too: linuxdeploy treats them as always
          # available on the target system, but carrying our own (built with
          # a new toolchain) makes the AppImage start on older distros whose
          # system libstdc++ lacks the required GLIBCXX_*/CXXABI_* versions.
          for lib in /usr/lib/x86_64-linux-gnu/libstdc++.so.6 \
                     /usr/lib/x86_64-linux-gnu/libgcc_s.so.1; do
            if [ -e "$lib" ]; then cp -fL "$lib" AppDir/usr/lib/; fi
          done

          # Custom AppRun: KiCad's internal libraries live outside the default
          # dynamic loader path inside the AppImage; cover the multiarch dir
          # and any other layout CMAKE_INSTALL_LIBDIR may resolve to.
          cat > AppRun <<'EOF'
          #!/bin/bash
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/usr/lib/kicad:$HERE/usr/lib/x86_64-linux-gnu:$HERE/usr/lib64:$HERE/usr/lib:${LD_LIBRARY_PATH}"
          # Point PATHS::GetStockDataPath at the bundled stock data (API
          # schemas, the icon archive, i18n) - the compiled-in
          # /usr/share/kicad prefix is only correct for a conventional install.
          export KICAD_STOCK_DATA_HOME="$HERE/usr/share/kicad"
          exec "$HERE/usr/bin/kicad" "$@"
          EOF
          chmod +x AppRun

          curl -sSfL -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage

          # Prefer the main KiCad desktop entry so the AppImage is named and
          # iconified after KiCad itself; without it linuxdeploy silently uses
          # the first .desktop it finds (which happens to be pcbnew's, naming
          # the artifact "KiCad_PCB_Editor_(Standalone)").
          DESKTOP_FILE="$(find AppDir/usr/share/applications -name 'org.kicad.*.desktop' \
                           ! -name '*pcbnew*' ! -name '*eeschema*' ! -name '*gerbview*' \
                           ! -name '*pcbcalculator*' ! -name '*bitmap2component*' \
                           | head -1 || true)"
          DESKTOP_ARGS=()
          if [ -n "$DESKTOP_FILE" ]; then
            DESKTOP_ARGS+=( --desktop-file "$PWD/$DESKTOP_FILE" )
          fi

          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir "$PWD/AppDir" \
            --custom-apprun "$PWD/AppRun" \
            "${DESKTOP_ARGS[@]}" \
            --output appimage

          # Self-containment diagnostics: list what the packaged binaries
          # would still resolve from system paths at runtime.  Entries like
          # glibc, libGL/Mesa, X11, DBus, input-method or fontconfig libs are
          # expected and correct (they must come from the host); anything
          # else indicates a gap worth looking at.
          echo "--- runtime dependencies resolving from SYSTEM paths (informational) ---"
          ldd AppDir/usr/bin/kicad 2>/dev/null \
            | grep -Ev 'AppDir|/tmp/\.mount|linuxdeploy' || true
          echo "------------------------------------------------------------------------"

          # Keep the AppImage under the name linuxdeploy produced from the
          # desktop entry (no renaming).  Move the linuxdeploy tool out of the
          # way, then add a distro-suffixed copy so the two matrix variants
          # (24.04/26.04) do not collide with each other in the release/artifact
          # pages; only the suffixed copy is uploaded.
          mv linuxdeploy.AppImage linuxdeploy.tool
          cp -f KiCad-x86_64.AppImage "KiCad-x86_64-$DISTRO_ID.AppImage"

      - name: Upload artifact
        env:
          DISTRO_ID: ${{ matrix.distro }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.distro }}
          path: KiCad-x86_64-*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: build with MSVC + vcpkg and package a portable .zip (x64)
  # ---------------------------------------------------------------------------
  windows-zip:
    name: Windows ZIP (x64)
    runs-on: windows-2022
    env:
      # The GitHub runner does not set VCPKG_ROOT itself; clone into the workspace.
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"

      - name: Bootstrap vcpkg
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      # Seed the vcpkg downloads directory for upstreams that are flaky or
      # broken from Azure-hosted runners.  vcpkg accepts a pre-seeded file
      # when its SHA512 checksum matches the port (a mismatching file is
      # discarded and the regular download retried), so seeding can never
      # make things worse.  On Windows the default downloads directory is
      # %LOCALAPPDATA%\vcpkg.
      #  - www.cairographics.org is frequently very slow or unreachable, and
      #    vcpkg's WinHTTP download then times out (WinHttpSendRequest 12002).
      #    curl has no short receive timeout, proper retry handling, and the
      #    NetBSD pkgsrc distfile cache stores the byte-identical upstream
      #    release tarball (SHA512 verified against pkgsrc distinfo) as a
      #    fallback.
      #  - ngspice 41 was moved into SourceForge's old-releases area, so the
      #    mainline port's URL 404s on every mirror.  Seed it from the
      #    official old-releases location; the overlay-port REF patch below
      #    fixes the portfile side, this covers the download as well.
      - name: Pre-seed flaky upstream downloads
        run: |
          $downloads = Join-Path $env:LOCALAPPDATA 'vcpkg/downloads'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          # --- cairo ---
          $portJson = Get-Content "$env:VCPKG_ROOT\ports\cairo\vcpkg.json" -Raw | ConvertFrom-Json
          $portfile = Get-Content "$env:VCPKG_ROOT\ports\cairo\portfile.cmake" -Raw
          if( $portfile -notmatch 'cairographics\.org' )
          {
            Write-Host "cairo port no longer downloads from cairographics.org; nothing to pre-seed"
          }
          else
          {
            $version = $portJson.version
            $target = Join-Path $downloads "cairo-$version.tar.xz"
            if( Test-Path $target )
            {
              Write-Host "$target already present; nothing to do"
            }
            else
            {
              $tmp = Join-Path $env:RUNNER_TEMP "cairo-$version.tar.xz"
              $urls = @(
                "https://www.cairographics.org/releases/cairo-$version.tar.xz",
                "https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairo-$version.tar.xz"
              )
              $ok = $false
              foreach( $url in $urls )
              {
                Write-Host "Downloading $url"
                curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o $tmp $url
                if( $LASTEXITCODE -eq 0 )
                {
                  Move-Item -Force $tmp $target
                  $ok = $true
                  break
                }
                Remove-Item -Force -ErrorAction SilentlyContinue $tmp
              }
              if( -not $ok )
              {
                throw "Failed to download cairo-$version.tar.xz from all mirrors"
              }
              Write-Host "Seeded $target"
            }
          }

          # --- ngspice ---
          $ngspiceTarget = Join-Path $downloads 'ngspice-41.tar.gz'
          if( Test-Path $ngspiceTarget )
          {
            Write-Host "$ngspiceTarget already present; nothing to do"
          }
          else
          {
            $tmp = Join-Path $env:RUNNER_TEMP 'ngspice-41.tar.gz'
            curl.exe -fL --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 `
              -o $tmp `
              "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/old-releases/41/ngspice-41.tar.gz/download"
            if( $LASTEXITCODE -eq 0 )
            {
              Move-Item -Force $tmp $ngspiceTarget
              Write-Host "Seeded $ngspiceTarget"
            }
            else
            {
              Write-Host "::warning::ngspice pre-seed download failed; relying on the overlay port REF patch"
              Remove-Item -Force -ErrorAction SilentlyContinue $tmp
            }
          }

      # The in-tree vcpkg.json references KiCad's private "wxwidgets-33" port and
      # pins versions that the mainline registry does not carry.  Generate a build
      # variant that uses the mainline "wxwidgets" port, keeps the remaining
      # official overrides and drops the ngspice override (supplied by an overlay
      # port instead).
      - name: Prepare vcpkg manifest variant
        run: |
          $src = Get-Content vcpkg.json -Raw | ConvertFrom-Json

          # Map KiCad's private "wxwidgets-33" port onto the mainline "wxwidgets"
          # port.  KEEP the webview feature: libs/kiplatform compiles against
          # wxWebView, and without it the wx build turns wxUSE_WEBVIEW off -
          # wx/webview.h then declares nothing and the kiplatform webview port
          # fails with C2027 "use of undefined type 'wxWebView'".  The
          # mainline 'webview' feature pulls in the new-style 'webview2'
          # dependency (SDK headers + WebView2Loader), which the baseline
          # provides under that name.
          foreach( $dep in $src.dependencies )
          {
            if( $dep -is [pscustomobject] -and $dep.name -eq 'wxwidgets-33' )
            {
              $dep.name = 'wxwidgets'
            }
          }

          # kiplatform's webview port includes WebView2.h directly (wxWebView
          # Edge backend); pull the WebView2 SDK from vcpkg.  The port was
          # renamed upstream: 'microsoft-webview2' is gone from the registry
          # and baseline, the new name is 'webview2'.
          $src.dependencies += 'webview2'

          # Keep official overrides except ngspice (supplied by an overlay port,
          # see the next step).  glm stays pinned: the mainline 0.9.9.9 port is
          # broken per the upstream comment.
          if( $src.PSObject.Properties[ 'overrides' ] )
          {
            $kept = @( $src.overrides | Where-Object { $_.name -notin 'wxwidgets-33', 'ngspice' } )
            if( $kept.Count -gt 0 ){ $src.overrides = $kept }
            else { $src.PSObject.Properties.Remove( 'overrides' ) }
          }

          # Mainline vcpkg requires a baseline to resolve ports from the manifest
          $baseline = ( git -C $env:VCPKG_ROOT rev-parse HEAD ).Trim()
          $src | Add-Member -NotePropertyName 'builtin-baseline' -NotePropertyValue $baseline
          New-Item -ItemType Directory -Force -Path vcpkg-variant | Out-Null
          $src | ConvertTo-Json -Depth 20 | Set-Content vcpkg-variant/vcpkg.json -Encoding utf8
          Write-Host "builtin-baseline = $baseline"

      # ngspice: the mainline port downloads ngspice-41.tar.gz from
      # <project>/files/ng-spice-rework/41/, which now 404s on every mirror -
      # the ngspice project has moved the release into SourceForge's
      # old-releases area (same file, new path).  Patch the overlay port's REF
      # value to the official old-releases location; the tarball is
      # byte-identical, so the SHA512 pinned in the port still applies.  The
      # REF line is rewritten line-wise ( (?m) line anchors ) so both portfile
      # layouts are handled: "REF 41" (FILENAME separate) and
      # "REF 41/ngspice-41.tar.gz".  A no-match aborts the step instead of
      # leaving the port broken.
      - name: Prepare ngspice overlay port
        run: |
          New-Item -ItemType Directory -Force -Path overlay-ports | Out-Null
          Copy-Item -Recurse "$env:VCPKG_ROOT\ports\ngspice" overlay-ports/ngspice

          $portfile = Get-Content overlay-ports/ngspice/portfile.cmake -Raw
          if( $portfile -match '(?m)^\s*REF\s+old-releases/' )
          {
            Write-Host "ngspice port already references SourceForge old-releases; nothing to patch"
          }
          else
          {
            $updated = [regex]::Replace(
              $portfile,
              '(?m)^(\s*REF\s+)(?!old-releases/)(\S.*)$',
              '${1}old-releases/${2}'
            )
            if( $updated -eq $portfile )
            {
              Write-Host "portfile head for diagnosis:"
              Get-Content overlay-ports/ngspice/portfile.cmake | Select-Object -First 20
              throw "Failed to patch ngspice REF - mainline portfile layout changed"
            }
            Set-Content overlay-ports/ngspice/portfile.cmake -Value $updated -Encoding utf8
            Write-Host "overlay portfile rewritten:"
            Get-Content overlay-ports/ngspice/portfile.cmake | Select-Object -First 20
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-windows-x64-${{ hashFiles( 'vcpkg-variant/vcpkg.json' ) }}

      - name: Configure
        run: |
          New-Item -ItemType Directory -Force -Path vcpkg-binary-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = ( Resolve-Path vcpkg-binary-cache ).Path
          # Spell the build type out literally: a literal keeps the CMake
          # cache clean of any shell-quoting artefacts (a stray
          # '$env:CMAKE_BUILD_TYPE' leaked into the cache once and broke the
          # ninja rules file at build time, since CMake >= 3.28 embeds the
          # build type into the C++-module scan rule names).
          #
          # The configure also runs the vcpkg manifest install, which fails on
          # transient upstream errors (e.g. GitHub archive endpoints answering
          # 500 for some boost-* tarballs).  Every package that did build is
          # already in the binary cache and comes back instantly, so retrying
          # the whole configure with a backoff is cheap and usually crosses
          # the gap.
          $maxAttempts = 3
          for( $attempt = 1; $attempt -le $maxAttempts; $attempt++ )
          {
            Write-Host "=== configure attempt $attempt / $maxAttempts ==="
            cmake -G Ninja -S . -B build `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_INSTALL_PREFIX="$PWD\stage" `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_MANIFEST_DIR="$PWD\vcpkg-variant" `
              -DVCPKG_OVERLAY_PORTS="$PWD\overlay-ports" `
              -DVCPKG_OVERLAY_TRIPLETS="$PWD\tools\custom_vcpkg_triplets" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DKICAD_USE_OCC=ON `
              -DKICAD_USE_PCH=OFF `
              -DKICAD_USE_SENTRY=OFF `
              -DKICAD_INSTALL_DEMOS=ON `
              -DKICAD_BUILD_I18N=ON `
              -DKICAD_BUILD_QA_TESTS=OFF `
              -DKICAD_SPICE_QA=OFF
            if( $LASTEXITCODE -eq 0 )
            {
              break
            }
            if( $attempt -eq $maxAttempts )
            {
              exit $LASTEXITCODE
            }
            Write-Host "::warning::configure/vcpkg install failed (attempt $attempt/$maxAttempts); retrying after backoff"
            Start-Sleep -Seconds ( 20 * $attempt )
          }

      - name: Build
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = ( Resolve-Path vcpkg-binary-cache ).Path
          cmake --build build -j $env:NUMBER_OF_PROCESSORS

      - name: Install into staging directory
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = ( Resolve-Path vcpkg-binary-cache ).Path
          cmake --install build

      - name: Package ZIP
        run: |
          $VERSION = ( git describe --tags --always --dirty ) -replace '^v',''
          Compress-Archive -Path stage/* -DestinationPath "kicad-windows-x64-$VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: kicad-windows-x64-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release: attach all packages to the GitHub Release when building on a tag
  # ---------------------------------------------------------------------------
  release:
    name: Attach packages to release
    needs:
      - macos-dmg
      - linux-deb
      - linux-appimage
      - windows-zip
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Tag builds publish a regular release.  The files keep their original
      # names (.deb/.dmg/.AppImage/.zip) as release assets - no extra zipping.
      - name: Attach to release
        if: startsWith( github.ref, 'refs/tags/v' )
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Manual (workflow_dispatch) builds have no tag, and the Actions
      # artifact store always wraps uploads in a zip container.  Publish the
      # raw files - under their original names, no extra zip - as a rolling
      # draft release instead.  Drafts stay private until manually published;
      # the ci-latest tag/release is reused and its files overwritten.
      - name: Attach to rolling draft release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI build ${{ github.run_number }}
          draft: true
          overwrite_files: true
          files: dist/*
