##########################################################################
# Build KiCad on macOS and save the results
##########################################################################
macos_build:
  stage: build
  tags:
    - kicad-macos
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PROJECT_ROOT_NAMESPACE == "kicad"
  script:
    - mkdir -p build/macos
    - cd build/macos
    - cmake
      -G Ninja
      -DCMAKE_TOOLCHAIN_FILE=/Users/$USER/kicad-mac-builder/toolchain/kicad-mac-builder.cmake
      ../../
    - cmake --build . 2>&1 | tee compilation_log.txt
    - cd ../../
  artifacts:
    # Only save the artifacts that are needed for running the tests in the next stage
    # and the compilation log. The entire build directory is too large to save as an
    # artifact.
    expire_in: 2 hrs
    when: always
    paths:
      - build/macos/compilation_log.txt

# Report on the metrics of the code
# Fail in case of warnings
macos_report_build_warn_kicad:
  stage: report
  tags:
    - kicad-macos
  needs:
    - job: macos_build
      artifacts: true
  only:
    variables:
      - $CI_PROJECT_ROOT_NAMESPACE == "kicad"
  script:
    - cat build/macos/compilation_log.txt | { grep "warning:" || test $? = 1; } | awk 'END{print "number_of_macos_warnings "NR}' > metrics.txt
    - cat metrics.txt
    - (! grep -q "warning:" build/macos/compilation_log.txt)
  artifacts:
    when: always
    reports:
      metrics: metrics.txt
